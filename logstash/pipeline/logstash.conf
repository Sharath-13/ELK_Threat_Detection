# ==============================================================================
# Logstash Threat Detection Pipeline
# Project: Centralized Log Monitoring and Threat Detection System
# ==============================================================================

input {
  beats {
    port => 5044
  }
}

filter {
  # ----------------------------------------------------------------------------
  # 1. WINDOWS SECURITY LOG PROCESSING (Winlogbeat)
  # ----------------------------------------------------------------------------
  if [winlog] {
    # Normalize event ID to string
    mutate {
      add_field => { "log_source_os" => "Windows" }
    }

    # EVENT ID 4625: An account failed to log on (Brute Force / Credential Attack)
    if [winlog][event_id] == 4625 or [event][code] == "4625" {
      mutate {
        add_field => {
          "event_action"     => "failed_logon"
          "threat_detected"  => "Failed Login / Potential Brute Force"
          "threat_severity"  => "HIGH"
          "event_category"   => "authentication"
        }
      }

      # Extract Account Name
      if [winlog][event_data][TargetUserName] {
        mutate {
          add_field => { "threat_user" => "%{[winlog][event_data][TargetUserName]}" }
        }
      }

      # Extract Source IP Address
      if [winlog][event_data][IpAddress] and [winlog][event_data][IpAddress] != "-" {
        mutate {
          add_field => { "threat_source_ip" => "%{[winlog][event_data][IpAddress]}" }
        }
      } else {
        mutate {
          add_field => { "threat_source_ip" => "127.0.0.1 (Local Console)" }
        }
      }

      # Extract Logon Type (2=Interactive, 3=Network, 10=Remote Desktop RDP)
      if [winlog][event_data][LogonType] {
        mutate {
          add_field => { "logon_type" => "%{[winlog][event_data][LogonType]}" }
        }
      }

      # Translate Windows SubStatus Error Code into Human-Readable Failure Reason
      if [winlog][event_data][SubStatus] =~ /(?i)0xc000006a/ {
        mutate { add_field => { "failure_reason" => "Bad Password / Invalid Credentials" } }
      } else if [winlog][event_data][SubStatus] =~ /(?i)0xc0000064/ {
        mutate { add_field => { "failure_reason" => "User Account Does Not Exist" } }
      } else if [winlog][event_data][SubStatus] =~ /(?i)0xc0000234/ {
        mutate { add_field => { "failure_reason" => "Account Currently Locked Out" } }
      } else if [winlog][event_data][SubStatus] =~ /(?i)0xc0000072/ {
        mutate { add_field => { "failure_reason" => "Account Disabled" } }
      } else if [winlog][event_data][SubStatus] =~ /(?i)0xc0000193/ {
        mutate { add_field => { "failure_reason" => "Account Expired" } }
      } else {
        mutate { add_field => { "failure_reason" => "Logon Failed (Unclassified Code %{[winlog][event_data][SubStatus]})" } }
      }
    }

    # EVENT ID 4624: An account was successfully logged on
    else if [winlog][event_id] == 4624 or [event][code] == "4624" {
      mutate {
        add_field => {
          "event_action"     => "successful_logon"
          "threat_severity"  => "LOW"
          "event_category"   => "authentication"
        }
      }
      if [winlog][event_data][TargetUserName] {
        mutate {
          add_field => { "threat_user" => "%{[winlog][event_data][TargetUserName]}" }
        }
      }
      if [winlog][event_data][IpAddress] and [winlog][event_data][IpAddress] != "-" {
        mutate {
          add_field => { "threat_source_ip" => "%{[winlog][event_data][IpAddress]}" }
        }
      } else {
        mutate {
          add_field => { "threat_source_ip" => "127.0.0.1 (Local Console)" }
        }
      }
    }

    # Catch General Error and Warning Events
    else if [log][level] == "error" or [winlog][level] == "error" {
      mutate {
        add_field => {
          "event_action"    => "system_error"
          "threat_severity" => "MEDIUM"
          "event_category"  => "system_health"
        }
      }
    }
    else {
      mutate {
        add_field => {
          "event_action"    => "general_event"
          "threat_severity" => "INFO"
          "event_category"  => "audit"
        }
      }
    }
  }

  # ----------------------------------------------------------------------------
  # 2. LINUX AUTHENTICATION LOG PROCESSING (Filebeat /var/log/auth.log)
  # ----------------------------------------------------------------------------
  else if [log][file][path] =~ "auth" or [message] =~ "sshd" {
    mutate {
      add_field => { "log_source_os" => "Linux" }
    }

    # Linux Failed SSH Password Attempt
    if [message] =~ "Failed password" {
      grok {
        match => {
          "message" => "Failed password for (?:invalid user )?%{DATA:threat_user} from %{IP:threat_source_ip} port %{NUMBER:threat_port}"
        }
        tag_on_failure => ["_grokparsefailure_linux_failed_auth"]
      }
      mutate {
        add_field => {
          "event_action"     => "failed_logon"
          "threat_detected"  => "SSH Brute Force Attack"
          "threat_severity"  => "HIGH"
          "event_category"   => "authentication"
          "failure_reason"   => "Invalid SSH Password / Key"
        }
      }
    }

    # Linux Successful SSH Logon
    else if [message] =~ "Accepted password" or [message] =~ "Accepted publickey" {
      grok {
        match => {
          "message" => "Accepted (?:password|publickey) for %{DATA:threat_user} from %{IP:threat_source_ip} port %{NUMBER:threat_port}"
        }
        tag_on_failure => ["_grokparsefailure_linux_success_auth"]
      }
      mutate {
        add_field => {
          "event_action"     => "successful_logon"
          "threat_severity"  => "LOW"
          "event_category"   => "authentication"
        }
      }
    }
  }

  # ----------------------------------------------------------------------------
  # 3. FALLBACK FOR GENERAL / TEST EVENTS
  # ----------------------------------------------------------------------------
  else {
    mutate {
      add_field => {
        "log_source_os"   => "Generic"
        "event_category"  => "general"
        "threat_severity" => "INFO"
      }
    }
  }
}

output {
  # Write all processed security logs to Elasticsearch
  elasticsearch {
    hosts => ["${ELASTICSEARCH_HOST:http://elasticsearch:9200}"]
    user => "elastic"
    password => "${ELASTIC_PASSWORD}"
    index => "elk-threats-%{+YYYY.MM.dd}"
    ssl => false
  }

  # Print to container console for real-time monitoring and viva demonstration
  stdout {
    codec => rubydebug {
      metadata => false
    }
  }
}
